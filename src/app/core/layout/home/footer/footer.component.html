<footer class="py-6 px-4 mt-8">
  <div
    class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4"
  >
    <!-- Logo -->
    <div class="flex items-center gap-2">
      <a [routerLink]="['/']" class="flex items-center gap-2">
        <!-- width/height intrínsecos (73x71) reservam o espaço antes do download (anti-CLS) -->
        <img src="assets/logo.png" alt="Busca Missa" width="73" height="71" class="h-7 w-auto" />
        <h5 class="text-lg font-semibold">Busca Missa</h5>
      </a>
    </div>

    <!-- Navegação -->
    <nav class="flex flex-wrap gap-4 text-sm font-medium">
      <a routerLink="/home" class="hover:underline transition">INÍCIO</a>
      <a routerLink="/solicitar" class="hover:underline transition"
        >ENTRE EM CONTATO</a
      >
      <a routerLink="/nova" class="hover:underline transition"
        >CADASTRAR MISSA</a
      >
      <a routerLink="/anuncios" class="hover:underline transition"
        >ANUNCIANTES</a
      >
      <a routerLink="/contribuir" class="hover:underline transition"
        >CONTRIBUIR</a
      >
      <a routerLink="/meu-painel" class="hover:underline transition"
        >MEU PAINEL</a
      >
    </nav>
    

    <!-- Redes sociais + Créditos -->
    <div class="flex flex-col items-center md:items-end gap-2 mt-4 md:mt-0">
      <a href="https://www.instagram.com/buscamissa/" target="_blank" rel="noopener noreferrer"
        aria-label="Instagram do BuscaMissa"
        class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-800 transition">
        <i class="pi pi-instagram" aria-hidden="true"></i>
        <span>&#64;buscamissa</span>
      </a>
      <div class="text-xs text-gray-400 text-center md:text-right">
        © {{ currentYear }} BuscaMissa. Todos os direitos reservados.
      </div>
      <div class="text-xs text-gray-400 text-center md:text-right">
        Desenvolvido por
        <a href="https://petratech.dev/" target="_blank" rel="noopener noreferrer"
          class="hover:underline transition text-gray-500">PetraTech</a>
      </div>
    </div>
    
  </div>

    <!-- Explorar: hubs de navegação. Vive no footer de todas as páginas para
         manter a linkagem interna que saiu da home junto com os chips de estado. -->
    <nav
      class="max-w-7xl mx-auto mt-6 pt-4 border-t border-gray-100 flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-sm"
      aria-label="Explorar"
    >
      <span class="text-xs font-semibold uppercase tracking-wide text-gray-400">Explorar</span>
      <a routerLink="/cidades" class="text-gray-600 hover:underline transition">Cidades</a>
      <a routerLink="/estados" class="text-gray-600 hover:underline transition">Estados</a>
      <a routerLink="/dias" class="text-gray-600 hover:underline transition">Dias da semana</a>
      <a routerLink="/missa-agora" class="text-gray-600 hover:underline transition">Missa agora</a>
    </nav>

      <!-- Links menores abaixo -->
    <div
      class="flex flex-wrap gap-3 text-xs text-gray-500 justify-center md:justify-center"
    >
      <a routerLink="/cookies" class="hover:underline transition">Cookies</a>
      <a routerLink="/termos" class="hover:underline transition"
        >Termos de Uso</a
      >
      <a routerLink="/privacidade" class="hover:underline transition"
        >Política de Privacidade</a
      >
    </div>
</footer>
