<section class="scoreboard" *ngIf="proximaMissa">
  <span class="scoreboard-label">Próxima missa</span>
  <div class="flex items-end flex-wrap gap-x-3 gap-y-1 mt-1">
    <span class="scoreboard-time">{{ formatarHorario(proximaMissa.horario) }}</span>
    <span class="scoreboard-day">{{ proximaMissaDiaLabel }}<span *ngIf="proximaMissaData" class="scoreboard-data">{{ proximaMissaDiaLabel ? ', ' : '' }}{{ proximaMissaData }}</span></span>
  </div>
  <div *ngIf="mostrarContador" class="scoreboard-countdown mt-1.5 flex items-center gap-1.5">
    <i class="pi pi-clock text-sm"></i>
    <app-countdown-chip [diaSemana]="proximaMissa.diaSemana!" [horario]="proximaMissa.horario" [regra]="proximaMissa" />
  </div>
  <!-- Outras missas do mesmo dia: substitui o antigo "Ver todas as missas",
       que só rolava a página até a grade logo abaixo. -->
  <p *ngIf="outrasNoDia.length" class="scoreboard-outras">
    <i class="pi pi-calendar"></i>
    Também neste dia: {{ outrasNoDia.join(' · ') }}
  </p>
</section>
