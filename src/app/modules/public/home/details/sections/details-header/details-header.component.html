<header class="church-header">

  <!-- Thumbnail -->
  <div class="church-thumb shrink-0">
    <!-- Esta foto É o elemento LCP da página de paróquia (medido: prod mobile,
         LCP 5.012ms). Com `loading="lazy"` o preload scanner a ignorava e ela só
         era descoberta em t=1.652ms, depois de CSS e layout — 1,4s de atraso puro.
         É a ÚNICA <img> da subárvore de details e fica sempre no topo, então
         priorizá-la não tira prioridade de nenhuma outra imagem.
         Sem width/height de propósito: o contêiner já reserva a caixa nos dois
         breakpoints (a proporção inverte entre eles) e a imagem contribui 0 de CLS. -->
    <img *ngIf="igreja.imagemUrl && !fotoQuebrou"
      [src]="igreja.imagemUrl" [alt]="igreja.nome"
      (error)="fotoQuebrou = true"
      fetchpriority="high"
      class="w-full h-full object-cover">
    <app-church-placeholder *ngIf="!igreja.imagemUrl || fotoQuebrou" [showLabel]="false" />
  </div>

  <!-- Info -->
  <div class="church-info">
    <!-- Selo fora do <h1>: o título indexado/anunciado é só o nome da igreja. -->
    <div class="flex flex-wrap items-center gap-y-1">
      <h1 class="text-gray-900 font-extrabold m-0">{{ igreja.nome }}</h1>
      <span *ngIf="verificada" class="selo-verificado"
            title="As informações desta igreja são mantidas por um responsável verificado (pároco ou secretaria).">
        <i class="pi pi-verified"></i> Responsável Verificado
      </span>
    </div>

    <!-- Endereço: linha da rua + linha da cidade, sem ícone repetido -->
    <div class="church-endereco">
      <p *ngIf="linhaRua">{{ linhaRua }}</p>
      <p>{{ linhaCidade }}</p>
    </div>

    <p *ngIf="igreja.paroco || dioceseNome" class="church-meta">
      <span *ngIf="igreja.paroco"><i class="pi pi-user"></i> {{ igreja.paroco }}</span>
      <span *ngIf="dioceseNome"><i class="pi pi-sitemap"></i> {{ dioceseNome }}</span>
    </p>

    <div *ngIf="proximaMissa">
      <app-confidence-badge [mass]="proximaMissa" />
    </div>

    <!-- Ações principais: chegar e falar com a igreja -->
    <div class="church-contatos flex gap-2 flex-wrap mt-2">
      <a [href]="linkGoogleMaps" target="_blank" rel="noopener" class="action-btn action-btn--primary" (click)="direcoesClick.emit()">
        <i class="pi pi-map-marker"></i> Como chegar
      </a>
      <a [href]="linkWaze" target="_blank" rel="noopener" class="action-btn" (click)="direcoesClick.emit()">
        <i class="pi pi-car"></i> Waze
      </a>
      <a *ngIf="igreja.contato?.telefoneWhatsApp"
         [href]="'https://wa.me/55' + igreja.contato.dddWhatsApp + igreja.contato.telefoneWhatsApp"
         target="_blank" rel="noopener" class="action-btn action-btn--contato-whatsapp"
         aria-label="Conversar com a igreja pelo WhatsApp"
         (click)="objetivoClick.emit('whatsapp'); telefoneClick.emit()">
        <i class="pi pi-whatsapp"></i> WhatsApp
      </a>
      <a *ngIf="igreja.contato?.telefone"
         [href]="'tel:' + igreja.contato.ddd + igreja.contato.telefone" class="action-btn"
         [attr.aria-label]="'Ligar para (' + igreja.contato.ddd + ') ' + igreja.contato.telefone"
         (click)="objetivoClick.emit('ligar'); telefoneClick.emit()">
        <i class="pi pi-phone"></i> Ligar
      </a>
      <a *ngIf="siteUrl" [href]="siteUrl" target="_blank" rel="noopener" class="action-btn"
         [attr.aria-label]="'Site: ' + siteLabel" (click)="objetivoClick.emit('site')">
        <i class="pi pi-globe"></i> Site
      </a>
      <!-- Agrupados para quebrarem de linha juntos, sem deixar um ícone sozinho. -->
      <div *ngIf="igreja.contato?.emailContato || igreja.redesSociais?.length" class="church-icones">
        <a *ngIf="igreja.contato?.emailContato" [href]="'mailto:' + igreja.contato.emailContato"
           class="action-btn action-btn--icon" [attr.aria-label]="'E-mail: ' + igreja.contato.emailContato">
          <i class="pi pi-envelope"></i>
        </a>
        <a *ngFor="let rede of igreja.redesSociais; trackBy: trackRede" [href]="rede.url" target="_blank" rel="noopener"
           class="action-btn action-btn--icon" [attr.aria-label]="rede.nomeRedeSocial || 'Rede social'"
           (click)="socialClick.emit(rede.url)">
          <i [ngClass]="getSocialIcon(rede.url)"></i>
        </a>
      </div>
    </div>

    <!-- Ações secundárias (3 colunas compactas no celular) -->
    <div class="church-secundarias">
      <button type="button" (click)="compartilharClick.emit()" class="action-btn action-btn--ghost"
              aria-haspopup="dialog" title="Envie os horários de missa para um amigo">
        <i class="pi pi-share-alt"></i> Compartilhar
      </button>
      <button *ngIf="temMissas" type="button" (click)="agendaClick.emit()" class="action-btn action-btn--ghost"
              aria-haspopup="dialog" title="Salve a missa na sua agenda, com repetição">
        <i class="pi pi-calendar-plus"></i> Agenda
      </button>
      <button type="button" (click)="favoritarClick.emit()" class="action-btn action-btn--ghost action-btn--fav"
              [class.action-btn--fav-ativo]="isFavorita"
              [attr.aria-pressed]="isFavorita"
              [attr.aria-label]="isFavorita ? 'Remover dos favoritos' : 'Adicionar aos favoritos'">
        <i class="pi" [ngClass]="isFavorita ? 'pi-heart-fill' : 'pi-heart'"></i>
        {{ isFavorita ? 'Favoritada' : 'Favoritar' }}
      </button>
    </div>
    <button *ngIf="!temContato" type="button" class="church-add-contato" (click)="adicionarContato.emit()">
      <i class="pi pi-plus"></i> Adicionar telefone ou redes
    </button>
  </div>
</header>
