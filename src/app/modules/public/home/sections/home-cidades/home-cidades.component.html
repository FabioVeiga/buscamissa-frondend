<section class="cidades-chips" aria-labelledby="cidades-titulo">
  <div class="sec-header sec-header--cidades">
    <div>
      <h2 id="cidades-titulo" class="sec-header__titulo">
        <i class="pi pi-building sec-header__icone" aria-hidden="true"></i>
        Encontre missas por cidade
      </h2>
      <p class="sec-header__sub">Veja horários e igrejas nas cidades mais buscadas.</p>
    </div>
  </div>

  <!-- Wrapper com min-height reservado para evitar CLS quando geo resolve -->
  <div class="cidades-chips__geo-wrap" [class.cidades-chips__geo-wrap--vazio]="geoFalhou">
    <a *ngIf="geoEncontrada && cidadeDetectada"
       [routerLink]="['/missas', cidadeDetectada!.uf.toLowerCase(), cidadeDetectada!.slug]"
       class="cidade-destaque">
      <div class="cidade-destaque__icon" aria-hidden="true"><i class="pi pi-map-marker"></i></div>
      <div class="cidade-destaque__info">
        <span class="cidade-destaque__label">Sua cidade</span>
        <span class="cidade-destaque__nome">{{ cidadeDetectada!.nome }}</span>
      </div>
      <span class="cidade-destaque__estado">{{ cidadeDetectada!.uf }}</span>
      <i class="pi pi-arrow-right cidade-destaque__arrow"></i>
    </a>
  </div>

  <!-- Mesmas cidades e mesmos links /missas/{uf}/{slug} de antes; só o visual muda. -->
  <div class="cidades-grade">
    @for (c of cidades; track c.uf + '-' + c.slug; let i = $index) {
    <a [routerLink]="['/missas', c.uf.toLowerCase(), c.slug]"
       class="cidade-card"
       [class.cidade-card--skip]="geoEncontrada && i === 0">
      <span class="cidade-card__nome">{{ c.nome }}</span>
      <span class="cidade-card__uf">{{ c.uf }}</span>
    </a>
    }
    <a routerLink="/cidades" class="cidade-card cidade-card--todas">
      <span class="cidade-card__nome">Ver todas as cidades</span>
      <i class="pi pi-arrow-right" aria-hidden="true"></i>
    </a>
  </div>
</section>
